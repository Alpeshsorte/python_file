<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Reset and core page alignment */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #0b0c10;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* Heading style matching your home page */
h1 {
    margin-bottom: 25px;
    font-size: 2.2rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #c5a3ff;
    text-shadow: 0 0 10px rgba(197, 163, 255, 0.6);
    text-align: center;
}

/* Glassmorphism/Dark container for the form */
form {
    background-color: #1a1a24;
    border: 2px solid #2d2d3f;
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    gap: 18px; /* Perfectly spaces out each input box */
}

/* Uniform layout for all form inputs */
form input {
    width: 100%;
    padding: 12px 18px;
    background-color: #0f0f14;
    border: 2px solid #44475a;
    border-radius: 8px;
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.3s ease;
}

/* Remove up/down spinners on the number input field */
form input[type="number"]::-webkit-outer-spin-button,
form input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}
/* form input[type="number"] {
    -moz-appearance: textfield;
} */

/* Glow styling when clicking/typing inside inputs */
form input:focus {
    border-color: #bd93f9;
    box-shadow: 0 0 10px rgba(189, 147, 249, 0.3);
}

/* Registration action button styling */
form button[type="submit"] {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background-color: #bd93f9;
    border: none;
    border-radius: 8px;
    color: #0f0f14;
    font-size: 1.05rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
}

/* Register button hover & pulse state */
form button[type="submit"]:hover {
    background-color: #a370f7;
    color: #fff;
    box-shadow: 0 0 15px rgba(163, 112, 247, 0.6);
}

    </style>
</head>
<body>

    <h1>ragister page</h1>
      {% if messages %}
        {% for message in messages %}
            <div style="padding:10px;margin:10px;color: red;background:black;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        <input type="text" value="" name="first_name" placeholder="first_name">
        <input type="text" value="" name="last_name" placeholder="last_name">
        <input type="text" value="" name="username" placeholder="username">
        <input type="email" value="" name="email" placeholder="Enter email">
        <input type="password" value="" name="password" placeholder="Enter password">
        <input type="password" value="" name="confirm_password" placeholder="Enter confirm password">
        <button type="submit">Register</button>
    </form>

    
</body>
</html>
