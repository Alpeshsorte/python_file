<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
           * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Centered layout panel card */
        .logout-container {
            background-color: #1a1a24;
            border: 2px solid #2d2d3f;
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        /* Neon warning header style */
        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff5555; /* Distinct red color for exit actions */
            text-shadow: 0 0 10px rgba(255, 85, 85, 0.4);
            margin-bottom: 15px;
        }

        /* Supporting descriptive copy */
        p {
            color: #a9a9b3;
            font-size: 1rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Styled logout link looking like an action button */
        .logout-btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background-color: #ff5555;
            color: #fff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        /* Interactive pulse glow state for logouts */
        .logout-btn:hover {
            background-color: #ff4747;
            box-shadow: 0 0 15px rgba(255, 85, 85, 0.6);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    
    {% if messages %}
        {% for message in messages %}
            <div style="padding:10px;margin:10px;color: red;background:black;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    <h1>logout page</h1>
    <a href="{% url 'logout' %}">Logout</a>

</body>
</html>
